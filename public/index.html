<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twilio WebRTC Phone</title>
  <script src="https://unpkg.com/@twilio/voice-sdk@2.10.2/dist/twilio.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      background: #f0f0f0;
    }
    .status.ready { background: #d4edda; }
    .status.busy { background: #fff3cd; }
    .status.error { background: #f8d7da; }
    button {
      padding: 12px 24px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    #callBtn { background: #28a745; color: white; }
    #callBtn:disabled { background: #ccc; }
    #hangupBtn { background: #dc3545; color: white; }
    #hangupBtn:disabled { background: #ccc; }
    #status {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #log {
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>📞 Browser Phone</h1>
  
  <div class="input-group">
    <label for="phoneNumber">Phone Number (with extension)</label>
    <input type="tel" id="phoneNumber" placeholder="+1234567890,1234" />
  </div>
  
  <div>
    <button id="callBtn" disabled>📞 Test Call</button>
    <button id="hangupBtn" disabled>📴 Hang Up</button>
  </div>
  
  <div id="status">Initializing...</div>

  <div id="log" style="margin-top: 20px; text-align: left; font-size: 12px; max-height: 200px; overflow-y: auto; background: #f5f5f5; padding: 10px; border-radius: 4px;"></div>

  <script>
    const STORAGE_KEY = 'twilio_phone_number';
    const statusEl = document.getElementById('status');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const phoneInput = document.getElementById('phoneNumber');
    const logEl = document.getElementById('log');
    let device;
    let activeCall;

    // Load saved phone number from localStorage
    const savedNumber = localStorage.getItem(STORAGE_KEY);
    if (savedNumber) {
      phoneInput.value = savedNumber;
    }

    // Save phone number to localStorage on change
    phoneInput.addEventListener('input', () => {
      localStorage.setItem(STORAGE_KEY, phoneInput.value);
    });

    function log(msg) {
      console.log(msg);
      logEl.innerHTML += `<p style="margin:2px 0">${new Date().toLocaleTimeString()}: ${msg}</p>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    async function init() {
      // Wait for Twilio SDK to be available
      if (typeof Twilio === 'undefined') {
        setStatus('Loading SDK...', '');
        setTimeout(init, 100);
        return;
      }

      try {
        const res = await fetch('/token');
        const { token, identity } = await res.json();
        
        device = new Twilio.Device(token, {
          codecPreferences: ['opus', 'pcmu']
        });

        device.on('registered', () => {
          setStatus(`Ready as "${identity}"`, 'ready');
          callBtn.disabled = false;
          log('Device registered');
        });

        device.on('error', (twilioError) => {
          setStatus('Error: ' + twilioError.message, 'error');
          log('Error: ' + twilioError.message);
        });

        device.on('incoming', (call) => {
          setStatus('Incoming call...', 'busy');
          log('Incoming call');
          call.accept();
          activeCall = call;
          hangupBtn.disabled = false;
          callBtn.disabled = true;
          
          call.on('disconnect', () => {
            setStatus('Call ended', 'ready');
            log('Call disconnected');
            activeCall = null;
            hangupBtn.disabled = true;
            callBtn.disabled = false;
          });
        });

        log('Registering device...');
        await device.register();

      } catch (err) {
        setStatus('Failed to initialize: ' + err.message, 'error');
        log('Init error: ' + err.message);
        console.error(err);
      }
    }

    callBtn.addEventListener('click', async () => {
      const phoneNumber = phoneInput.value.trim();
      if (!phoneNumber) {
        setStatus('⚠️ Please enter a phone number', 'error');
        return;
      }
      setStatus('📞 Calling...', 'busy');
      try {
        activeCall = await device.connect({ To: phoneNumber });
        callBtn.disabled = true;
        hangupBtn.disabled = false;
        log('Call connected');
        
        activeCall.on('disconnect', () => {
          setStatus('Call ended', 'ready');
          log('Call disconnected');
          activeCall = null;
          hangupBtn.disabled = true;
          callBtn.disabled = false;
        });
      } catch (err) {
        log('Call error: ' + err.message);
        setStatus('Error: ' + err.message, 'error');
      }
    });

    hangupBtn.addEventListener('click', () => {
      if (activeCall) {
        activeCall.disconnect();
      }
    });

    // Start initialization when page loads
    window.addEventListener('load', init);
  </script>
</body>
</html>
